[project]
name = "smartlect-worker"
version = "0.1.0"
description = "SmartLect ML worker: speech recognition, board OCR and lecture notes generation"
requires-python = ">=3.11"
dependencies = [
    "pika>=1.3",
    "boto3>=1.35",
]

[project.optional-dependencies]
# Распознавание речи
whisper = ["faster-whisper>=1.1"]
# Распознавание доски; нужен ещё бинарник tesseract: brew install tesseract tesseract-lang
ocr = ["pytesseract>=0.3.13", "pillow>=10"]
dev = ["pytest>=8"]

[project.scripts]
smartlect-worker = "smartlect_worker.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["smartlect_worker*"]
