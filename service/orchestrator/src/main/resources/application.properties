spring.application.name=orchestrator
server.port=8081

# PostgreSQL (docker-compose, порт 5433)
spring.datasource.url=jdbc:postgresql://localhost:5433/smartlect
spring.datasource.username=smartlect
spring.datasource.password=smartlect
spring.jpa.open-in-view=false

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=smartlect
spring.rabbitmq.password=smartlect

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Схему создаёт только Flyway (src/main/resources/db/migration), Hibernate её лишь проверяет
spring.jpa.hibernate.ddl-auto=validate

# Загрузка файлов: аудио лекции до 500 МБ
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=520MB

# S3 (SeaweedFS из docker-compose)
smartlect.storage.endpoint=http://localhost:9100
smartlect.storage.region=us-east-1
smartlect.storage.access-key=smartlect
smartlect.storage.secret-key=smartlect-secret
smartlect.storage.bucket=lectures

# Ошибки API в формате RFC 9457 (application/problem+json)
spring.mvc.problemdetails.enabled=true

# Авторизация. Секрет только для локальной разработки — на сервере задать
# через переменную окружения SMARTLECT_AUTH_JWT_SECRET (base64, >= 32 байт).
smartlect.auth.jwt-secret=ktB5LwiV9omguJhO6UF8kCDayKZ/yRC2amkpc4rXhlg=
smartlect.auth.access-token-ttl=15m
smartlect.auth.refresh-token-ttl=30d

# Обработка: этап запускается не больше max-attempts раз, затем лекция FAILED + инцидент
smartlect.processing.max-attempts=2

# События воркеров: при ошибке 3 попытки, затем сообщение уходит в очередь smartlect.dead
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Уведомления об инцидентах. Пусто — только в лог.
# Задать через SMARTLECT_TELEGRAM_BOT_TOKEN и SMARTLECT_TELEGRAM_CHAT_ID.
smartlect.telegram.bot-token=
smartlect.telegram.chat-id=
smartlect.incidents.notify-interval-ms=30000
